version: "3.9"

services:
  app:
    build: .
    container_name: rest-api-auth-app
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_USER: postgres
      DB_PASSWORD: postgres123
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: authdb
      JWT_SECRET: a3f8c9e21b7d4f6a8e2c1d9b5f7a3e8c6d4b2f9a1e7c3d5b8f4a6c2e9d1b7f3a
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: rest-api-auth-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: authdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: